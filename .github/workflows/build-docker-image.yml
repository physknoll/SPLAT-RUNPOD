name: Build Gaussian-LIC Docker Image

on:
  workflow_dispatch:  # Allows manual trigger from GitHub Actions tab
    inputs:
      docker_tag:
        description: 'Docker image tag (e.g., latest, v1.0.0)'
        required: false
        default: 'latest'
  push:
    branches:
      - main
    paths:
      - 'Dockerfile**'
      - 'Gaussian-LIC/**'
      - '.github/workflows/build-docker-image.yml'

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/gaussian-lic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.event.inputs.docker_tag || 'latest' }}
            type=sha,prefix={{branch}}-
            type=ref,event=branch
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1
      
      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"
      
      - name: Summary
        run: |
          echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.IMAGE_NAME }}:${{ github.event.inputs.docker_tag || 'latest' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to RunPod console" >> $GITHUB_STEP_SUMMARY
          echo "2. Deploy pod with image: \`${{ env.IMAGE_NAME }}:${{ github.event.inputs.docker_tag || 'latest' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "3. Start processing your datasets!" >> $GITHUB_STEP_SUMMARY

